<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Kirjautuminen</title>
</head>

<body>
  <h2>Kirjautuminen</h2>
  {% for message in get_flashed_messages() %}
    <p>
      <b>{{ message }}</b>
    </p>
  {% endfor %}

  {% if session.username %}
  <p>
    Olet kirjautunut sisään käyttäjätunnuksella <strong>{{ session.username }}</strong>.
  </p>
  <p>
    <a href="/logout">Kirjaudu ulos</a>
  </p>

  {% else %}
  <form action="/login" method="post">
    <p>
      Tunnus: <br />
      <input type="text" name="username" />
    </p>
    <p>
      Salasana: <br />
      <input type="password" name="password" />
    </p>
    <input type="submit" value="Kirjaudu" />
  </form>
  {% endif %}
</body>

</html>
