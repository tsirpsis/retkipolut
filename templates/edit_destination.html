{% extends "layout.html" %}

{% block title %}Retkikohteen muokkaus{% endblock %}

{% block content %}

<h2>Muokkaa retkikohteen tietoja</h2>

<form action="/update_destination" method="post">
  <p>
    <label for="title">Retkikohteen nimi</label> <br />
    <input type="text" name="title" id="title" value="{{ destination.title }}"
      maxlength="50" required/>
  </p>
  <p>
    <label for="description">Kohteen kuvaus</label> <br />
    <textarea name="description" id="description" rows="5" cols="60"
      maxlength="2000" required>{{ destination.content }}</textarea>
  </p>
  <input type="hidden" name="destination_id" value="{{ destination.id }}"/>

  {% for class in all_classes %}
  <p>
    <label for="class{{ class }}">{{ class }}</label> <br />
    <select name="classes" id="class{{ class }}">
    <option value="">(Valitse)</option>
    {% for option in all_classes[class] %}
      {% if classes[class] == option %}
        <option value="{{ class }}:{{ option }}" selected>{{ option }}
        </option>
      {% else %}
        <option value="{{ class }}:{{ option }}">{{ option }}</option>
      {% endif %}
    {% endfor %}
    </select>
  </p>
  {% endfor %}
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Tallenna"/>
</form>

<p>
  <a href="{{ request.referrer if request.referrer else '/' }}">Takaisin</a>
</p>
{% endblock %}
