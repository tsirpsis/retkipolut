<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Kohteen kuvat</title>
</head>

<body>
  {% for message in get_flashed_messages() %}
    <p>
      <b>{{ message }}</b>
    </p>
  {% endfor %}

  <h2>Kohteen kuvat</h2>

  {% if session.user_id == destination.user_id %}
    <h3>Lisää uusi kuva</h3>
    <p>Kuvan tiedostomuodon tulee olla .png tai .jpg ja kuvan maksimikoko on 500 KB.</p>
    <form action="/add_image" method="post" enctype="multipart/form-data">
      <p>
        Kuva: <input type="file" name="image" accept=".jpg, .png" />
      </p>
      <input type="hidden" name="destination_id" value="{{ destination.id }}"/>
      <input type="submit" value="Lähetä" />
    </form>
  {% endif %}

  <p>
    <a href="/destination/{{ destination.id }}">Takaisin</a><br />
    <a href="/">Palaa etusivulle</a>
  </p>

</body>

</html>
